<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduStream - Catálogo de Conteúdos</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Cabeçalho Único (Injetado pelo layout.js) -->
  <div id="app-header"></div>

  <main class="container">
    <section>
      <h2>Catálogo de conteúdos</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.25rem;">
        Encontre vídeos e materiais para estudar.
      </p>

      <div style="margin-bottom: 1.5rem; max-width: 340px;">
        <label for="filtro-categoria" style="display: block; margin-bottom: 0.4rem;">
          Filtrar por categoria:
        </label>
        <select id="filtro-categoria">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

      <!-- Mantido o ID original da Equipe 2 + classe .grid do Design System -->
      <section id="lista-conteudos" class="grid" aria-label="Lista de conteúdos">
        <!-- Os conteúdos serão carregados pelo JavaScript. -->
      </section>
    </section>
  </main>

  <!-- Rodapé Institucional Único (Injetado pelo layout.js) -->
  <div id="app-footer"></div>

  <!-- Scripts do Sistema e da Equipe 2 -->
  <script src="/assets/js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/equipe2/conteudos.js"></script>

</body>
</html>
