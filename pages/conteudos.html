
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduStream - Catálogo de Conteúdos</title>

  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Cabeçalho injetado pelo layout.js -->
  <div id="app-header"></div>

  <main class="container">

    <section>

      <h2>Catálogo de conteúdos</h2>

      <p>
        Encontre vídeos e materiais para estudar.
      </p>

      <!-- Botão exclusivo para professores e administradores -->
      <div id="area-cadastro-conteudo" hidden>
        <a href="/pages/novo-conteudo.html" class="btn">
          + Novo conteúdo
        </a>
      </div>

      <!-- Filtro por categoria -->
      <div>
        <label for="filtro-categoria">
          Filtrar por categoria:
        </label>

        <select id="filtro-categoria">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <!-- Mensagens do sistema -->
      <p
        id="mensagem"
        class="mensagem"
        role="status"
        aria-live="polite"
      ></p>

      <!-- Lista de conteúdos -->
      <section
        id="lista-conteudos"
        class="grid"
        aria-label="Lista de conteúdos"
      >
        <!-- Conteúdos carregados pelo JavaScript -->
      </section>

    </section>

  </main>

  <!-- Rodapé injetado pelo layout.js -->
  <div id="app-footer"></div>

  <!-- Scripts do sistema -->
  <script src="/assets/js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/equipe2/conteudos.js"></script>

</body>
</html>
