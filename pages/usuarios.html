<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduStream - Gerenciar Usuários</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Cabeçalho injetado automaticamente pelo layout.js -->
  <div id="app-header"></div>

  <main class="container">
    <h1>Gerenciamento de Usuários</h1>

    <!-- Área de mensagens (sucesso / erro) -->
    <div id="mensagem" class="mensagem" hidden></div>

    <!-- Tudo que o administrador vê fica dentro desta área -->
    <section id="area-gerenciamento">

      <!-- Pesquisa -->
      <div class="form-box">
        <label for="campo-pesquisa">Pesquisar por nome, e-mail ou ID</label>
        <input type="text" id="campo-pesquisa" placeholder="Digite para pesquisar...">
      </div>

      <!-- Formulário de edição (começa escondido) -->
      <div id="form-edicao" class="form-box" hidden>
        <h2>Editar usuário</h2>

        <label for="edit-nome">Nome</label>
        <input type="text" id="edit-nome">

        <label for="edit-email">E-mail</label>
        <input type="email" id="edit-email">

        <label for="edit-tipo">Tipo de usuário</label>
        <select id="edit-tipo">
          <option value="aluno">Aluno</option>
          <option value="professor">Professor</option>
          <option value="admin">Administrador</option>
        </select>

        <button type="button" class="btn" id="btn-salvar">Salvar alterações</button>
        <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
      </div>

      <!-- Lista de usuários (os cards são criados pelo usuarios.js) -->
      <div id="lista-usuarios" class="grid"></div>
    </section>
  </main>

  <!-- Rodapé injetado automaticamente pelo layout.js -->
  <div id="app-footer"></div>

  <!-- Biblioteca do Supabase + configuração do projeto -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/usuarios.js"></script>
</body>
</html>
